<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a6560"/>
      <stop offset="1" stop-color="#0a2b2e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f1ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#04181a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px tile centered on a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- Message bubble with its tail -->
  <g filter="url(#soft)">
    <rect x="214" y="256" width="596" height="452" rx="140" fill="url(#bubble)"/>
    <path d="M 296 630 L 248 826 L 462 690 Z" fill="#eaf3f1" stroke="#eaf3f1" stroke-width="28" stroke-linejoin="round"/>
  </g>

  <!-- Two lines of text drawn as gentle waves: messages that flow like a stream -->
  <g fill="none" stroke="#1f7a70" stroke-width="54" stroke-linecap="round">
    <path d="M 330 424 C 398 374 458 374 518 424 S 630 474 694 424"/>
    <path d="M 330 548 C 386 506 434 506 486 548 S 578 590 610 562" stroke="#e4572e"/>
  </g>

</svg>
